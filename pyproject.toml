[project]
name = "spec-compiler"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.26,<5",
  "rdflib>=7.1,<8",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "openapi-spec-validator>=0.7,<1",
  "poethepoet>=0.37,<1",
  "pytest>=8,<9",
]

[tool.poe.tasks]
generate-sql-api = { cmd = "python tools/generate.py --product products/sql_api_example", help = "Generate the SQL API contract" }
generate-spec-compiler = { cmd = "python tools/generate.py --product products/spec_compiler", help = "Generate the Spec Compiler contract" }
generate-kfw-458 = { cmd = "python tools/generate.py --product products/kfw_458_eligibility", help = "Generate the KfW 458 decision contract" }
generate-cloud-compliance = { cmd = "python tools/generate.py --product products/cloud_access_compliance", help = "Generate the cloud compliance decision contract" }
generate = { sequence = ["generate-sql-api", "generate-kfw-458", "generate-cloud-compliance", "generate-spec-compiler"], help = "Generate all contract tests and work items" }
ontology-validate = { cmd = "python tools/build_ontology_site.py --validate-only", help = "Validate the public ontology and its use in specs" }
support-inventory = { cmd = "python tools/compiler_support.py --output build/compiler-support.json", help = "Validate and export the compiler support inventory" }
documentation-site = { cmd = "python tools/build_documentation_site.py", help = "Build the complete HTML documentation website" }
documentation-preview = { cmd = "python tools/preview_documentation.py", help = "Serve and automatically refresh the local documentation" }
documentation-validate = { cmd = "python tools/build_documentation_site.py --validate-only", help = "Validate HTML sources, links, and diagram models" }
ontology-site = { ref = "documentation-site", help = "Build the complete documentation including ontology references" }
test = { cmd = "pytest -q", help = "Run the test suite" }
run = { sequence = ["generate", "ontology-validate", "documentation-validate", "test"], help = "Generate all artifacts and run validation and tests" }

[tool.pytest.ini_options]
testpaths = ["tools/tests", "products/sql_api_example/tests", "products/kfw_458_eligibility/tests", "products/cloud_access_compliance/tests", "products/spec_compiler/tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]
filterwarnings = [
  "ignore:Dataset.default_context is deprecated:DeprecationWarning",
]
